# Network-expansion data campaign.
#
# Inherits the adaptive coverage-constrained strategy but adds a network-EXPANSION
# axis on top of the existing branch-only topology axis: each expansion plan inserts
# new equipment (generators, off-nominal-tap transformers, greenfield PV buses, or a
# bus split) so the corpus covers system-upgrade scenarios, not just outages and
# reinforcements.
#
# Launch prerequisites (kept fully decoupled from any running campaign):
#   * Enumerate with the expansion axis:
#       scripts/create_operating_point.py ... --expansions-per-case <N>
#   * Solve with the transformer-aware runner so off-nominal-tap equipment is modeled:
#       export PGDF_OPF_SCRIPT=run_opf_expansion.jl
#   * Point map/reduce output at a UNIQUE runs-root and archive dir so nothing
#     collides with existing campaigns, e.g. RUNS_ROOT=data/outputs/runs_expansion
#     and ARCHIVE_DIR=data/outputs/archives_expansion.
#
# Preview the plans for any case before launching:
#   scripts/preview_expansion.py --case <case_id> -n <N> --seed <seed>

default_strategy: adaptive_coverage_constrained_multifidelity_ultrascale

network_expansion:
  # Number of expansion plans cycled across each case's candidates. The first plan
  # is always the empty baseline (no expansion); the rest cycle the five classes.
  expansions_per_case: 5
  # Aggressiveness knobs:
  #   max_additions_fraction > 0 makes the cascade depth RELATIVE to the network
  #   size: ceiling = round(fraction * bus_count), floored at 1 and capped by
  #   max_steps. This lets bigger topologies host proportionally bigger builds
  #   (a 3% expansion means ~3% on any case). 0 = use max_steps directly.
  max_additions_fraction: 0.03
  #   max_steps here acts as a SAFETY CAP on the size-derived ceiling so very
  #   large grids don't generate runaway cascades. Raise it to let the fraction
  #   dominate on big cases; lower it to bound solve cost. (With fraction unset,
  #   max_steps > 1 alone drives fixed-depth cascades: 1..max_steps.)
  max_steps: 64
  #   size_multiplier scales each new unit's capacity (generator pmax, branch
  #   rating). 1.0 = self-scaled to the case median; raise for larger builds.
  size_multiplier: 1.5
  # Transformer-aware Julia runner required to honor off-nominal tap / phase shift.
  julia_script: run_opf_expansion.jl
  classes:
    - generator_addition_expansion    # new generator on an under-served load bus
    - transformer_addition_expansion  # parallel off-nominal-tap transformer on a high-x corridor
    - greenfield_bus_expansion        # new PV bus + interconnecting line + generator
    - bus_split_expansion             # split a high-degree bus into two coupled buses
    - load_addition_expansion         # new demand (load growth / electrification) at a well-connected bus
  # Every expansion is connectivity-checked (is_connected_after_expansion) before
  # it is emitted; disconnecting plans are skipped.
  connectivity_required: true
  # Transformer-setpoint sweep: per-sample perturbation of transformer tap /
  # phase-shift so upgraded/added transformers are not static across the corpus.
  # Only observable via run_opf_expansion.jl (run_opf.jl ignores tap/shift); only
  # applied to elements that are already transformers. 0 = off.
  #   scripts/create_operating_point.py ... \
  #       --transformer-tap-sigma 0.02 --transformer-shift-sigma 2.0
  transformer_tap_sigma: 0.02      # multiplicative U[1-s,1+s), clamped to [0.9, 1.1]
  transformer_shift_sigma: 2.0     # additive degrees, U[-s, +s)

acquisition_budget:
  broad_coverage: 0.22
  active_constraint_novelty: 0.20
  security_boundary: 0.20
  credible_contingencies: 0.16
  high_severity_and_uncertainty: 0.12
  unscreened_audit: 0.10

portfolio_constraints:
  max_per_grid: 0
  max_per_regime: 0
  max_per_contingency_class: 0

operating_regimes:
  - baseline
  - low_load
  - shoulder
  - summer_peak
  - winter_peak
  - high_renewable
  - low_renewable
  - high_import
  - high_export
  - maintenance
  - branch_derating
  - generator_cost_shift
  - reactive_stress
  - extreme_peak

operating_space:
  generators:
    - sobol
    - latin_hypercube
    - stratified
    - regime_specific
    - time_series
  load_model:
    global_scale: true
    regional_correlated_variation: true
    local_residual_variation: true
    preserve_power_factor_default: true

security_margin_bands:
  comfortably_secure:
    minimum_margin: 0.10
  moderately_secure:
    minimum_margin: 0.03
    maximum_margin: 0.10
  near_boundary_secure:
    minimum_margin: 0.00
    maximum_margin: 0.03
  near_boundary_insecure:
    minimum_margin: -0.03
    maximum_margin: 0.00
  severely_insecure:
    maximum_margin: -0.03

active_constraint_tolerances:
  active_tolerance: 1.0e-4
  near_active_tolerance: 5.0e-3

screening:
  dc_as_feature_only: true
  multi_trigger_escalation: true
  uncertainty_multiplier: 2.33
  escalation_thresholds:
    dc_severity: 0.65
    voltage_risk: 0.65
    reactive_risk: 0.65
    novelty: 0.75
    uncertainty: 0.55

contingency_policy:
  ontology_required: true
  use_state_aware_scoring: true
  constrained_beam_search:
    enabled: true
    beam_width: 32
  preserve_random_credible_controls: true
  separate_simultaneous_vs_sequential: true

stopping_criteria:
  novelty_saturation:
    min_new_cluster_rate: 0.005
    min_new_active_set_rate: 0.005
  severe_false_negative_upper_confidence_tolerance: 0.01
