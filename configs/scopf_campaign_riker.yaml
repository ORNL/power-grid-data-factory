      - external/pglib-opf/pglib_opf_case9591_goc.m

  # 10k - 30k buses: one 15+5 set, 24 h per task.
  large:
    seeds: [0]
    sets: [{branches: 15, generators: 5}]
    timeout_s: 86400
    cases:
      - external/pglib-opf/pglib_opf_case10000_goc.m
      - external/tamu/activsg10k/extracted/case_ACTIVSg10k.m
      - external/pglib-opf/pglib_opf_case10192_epigrids.m
      - external/pglib-opf/pglib_opf_case10480_goc.m
      - external/pglib-opf/pglib_opf_case13659_pegase.m
      - external/pglib-opf/pglib_opf_case19402_goc.m
