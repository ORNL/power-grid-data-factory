      - external/pglib-opf/pglib_opf_case30000_goc.m

  # > 30k buses: one 15+5 set, 44 h per task (fits Riker's 48 h job cap).
  xlarge:
    seeds: [0]
    sets: [{branches: 15, generators: 5}]
    timeout_s: 158400
    cases:
